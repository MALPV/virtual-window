<!doctype html>
<html lang="es" data-precipitation="none" data-storm="false">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Window</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="window" aria-hidden="true">
      <div class="casing">
        <div class="opening">
          <div class="scene">
            <svg class="layer layer--sky" viewBox="0 0 400 600" preserveAspectRatio="xMidYMax slice">
              <defs>
                <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
                  <stop class="sky-stop sky-stop--0" offset="0" />
                  <stop class="sky-stop sky-stop--1" offset="0.45" />
                  <stop class="sky-stop sky-stop--2" offset="0.74" />
                  <stop class="sky-stop sky-stop--3" offset="1" />
                </linearGradient>
                <radialGradient id="sun-glow">
                  <stop class="sun-glow-stop" offset="0" stop-opacity="0.95" />
                  <stop class="sun-glow-stop" offset="0.25" stop-opacity="0.4" />
                  <stop class="sun-glow-stop" offset="1" stop-opacity="0" />
                </radialGradient>
              </defs>
              <rect width="400" height="600" fill="url(#sky)" />
              <g id="stars" class="stars"></g>
              <g id="sun" class="sun" transform="translate(286 402)">
                <circle r="130" fill="url(#sun-glow)" />
                <circle class="sun-disc" r="15" />
              </g>
              <rect class="cloud-deck" width="400" height="600" />
              <g class="cloud" data-cover="0.05" data-opacity="0.6">
                <ellipse cx="90" cy="150" rx="60" ry="10" />
                <ellipse cx="120" cy="142" rx="38" ry="12" />
                <ellipse cx="70" cy="146" rx="26" ry="9" />
              </g>
              <g class="cloud" data-cover="0.2" data-opacity="0.45">
                <ellipse cx="300" cy="232" rx="70" ry="8" />
                <ellipse cx="330" cy="225" rx="34" ry="10" />
              </g>
              <g class="cloud" data-cover="0.3" data-opacity="0.4">
                <ellipse cx="170" cy="318" rx="90" ry="6" />
                <ellipse cx="200" cy="313" rx="40" ry="7" />
              </g>
              <g class="cloud" data-cover="0.45" data-opacity="0.55">
                <ellipse cx="250" cy="90" rx="80" ry="13" />
                <ellipse cx="220" cy="82" rx="42" ry="14" />
                <ellipse cx="285" cy="84" rx="30" ry="10" />
              </g>
              <g class="cloud" data-cover="0.6" data-opacity="0.5">
                <ellipse cx="60" cy="260" rx="75" ry="9" />
                <ellipse cx="90" cy="253" rx="36" ry="11" />
              </g>
              <g class="cloud" data-cover="0.72" data-opacity="0.55">
                <ellipse cx="350" cy="160" rx="85" ry="12" />
                <ellipse cx="320" cy="152" rx="40" ry="13" />
              </g>
              <g class="cloud" data-cover="0.85" data-opacity="0.6">
                <ellipse cx="140" cy="210" rx="110" ry="11" />
                <ellipse cx="180" cy="40" rx="140" ry="16" />
                <ellipse cx="320" cy="370" rx="95" ry="7" />
              </g>
            </svg>

            <svg class="layer layer--land layer--far" viewBox="0 0 400 600" preserveAspectRatio="xMidYMax slice">
              <defs>
                <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#f3d9bb" stop-opacity="0" />
                  <stop offset="0.6" stop-color="#f3d9bb" stop-opacity="0.4" />
                  <stop offset="1" stop-color="#f3d9bb" stop-opacity="0" />
                </linearGradient>
              </defs>
              <path
                fill="#93a9c6"
                d="M0 452 L28 440 L62 446 L104 410 L136 432 L170 420 L212 438 L246 414 L284 396 L318 420 L352 408 L400 428 L400 600 L0 600 Z"
              />
              <path
                fill="#7d95b4"
                d="M0 474 L40 462 L78 470 L120 448 L162 468 L204 456 L250 472 L296 452 L340 470 L400 458 L400 600 L0 600 Z"
              />
              <rect y="430" width="400" height="60" fill="url(#haze)" />
            </svg>

            <svg class="layer layer--land layer--mid" viewBox="0 0 400 600" preserveAspectRatio="xMidYMax slice">
              <defs>
                <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#ecd9c0" />
                  <stop offset="1" stop-color="#9fb5cc" />
                </linearGradient>
              </defs>
              <rect y="480" width="400" height="44" fill="url(#lake)" />
              <path
                fill="#6e8a68"
                d="M0 500 C50 488 96 490 140 500 C180 509 214 512 250 504 C300 492 350 486 400 494 L400 600 L0 600 Z"
              />
              <path
                fill="#5d7a5a"
                d="M0 522 C60 508 120 512 175 524 C230 536 300 520 400 514 L400 600 L0 600 Z"
              />
            </svg>

            <div class="fog"></div>

            <svg class="layer layer--land layer--near" viewBox="0 0 400 600" preserveAspectRatio="xMidYMax slice">
              <defs>
                <symbol id="pine" viewBox="0 0 20 48">
                  <path d="M10 0 L4 14 H7 L2 26 H6 L0 40 H8.5 V48 H11.5 V40 H20 L14 26 H18 L13 14 H16 Z" />
                </symbol>
              </defs>
              <path
                fill="#3e5a44"
                d="M0 548 C60 532 120 536 180 550 C240 564 320 548 400 540 L400 600 L0 600 Z"
              />
              <g fill="#2c4434">
                <use href="#pine" x="-4" y="496" width="20" height="50" />
                <use href="#pine" x="14" y="484" width="22" height="56" />
                <use href="#pine" x="34" y="502" width="18" height="44" />
                <use href="#pine" x="336" y="500" width="16" height="40" />
                <use href="#pine" x="352" y="476" width="24" height="62" />
                <use href="#pine" x="376" y="494" width="20" height="48" />
              </g>
            </svg>

            <div class="precipitation">
              <div class="precipitation__wind">
                <div class="precipitation__sheet precipitation__sheet--rain-far"></div>
                <div class="precipitation__sheet precipitation__sheet--rain-near"></div>
                <div class="precipitation__sheet precipitation__sheet--snow-far"></div>
                <div class="precipitation__sheet precipitation__sheet--snow-near"></div>
              </div>
            </div>

            <div class="lightning"></div>
          </div>

          <div class="reflection"></div>

          <div class="sash">
            <div class="glass-drops"></div>
            <div class="frost">
              <div class="frost__pane"></div>
              <div class="frost__pane"></div>
              <div class="frost__pane"></div>
              <div class="frost__pane"></div>
            </div>
            <div class="mullion mullion--vertical"></div>
            <div class="mullion mullion--horizontal"></div>
          </div>

          <div class="reveal"></div>
        </div>

        <div class="stool"></div>
      </div>
    </div>
  </body>
</html>
