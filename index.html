<!doctype html>
<html
  lang="en"
  data-precipitation="none"
  data-storm="false"
  data-weather-overlay="on"
  data-frame-style="classic"
  data-frame-color="ivory"
  data-focus="false"
  data-motion="full"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Window</title>
    <link rel="stylesheet" href="/src/frame/frame.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="window" aria-hidden="true">
      <div class="casing">
        <div class="opening">
          <div class="scene-stage" id="scene-stage"></div>

          <div class="weather-overlay">
            <div class="precipitation depth">
              <div class="precipitation__wind">
                <div class="precipitation__sheet precipitation__sheet--rain-far"></div>
                <div class="precipitation__sheet precipitation__sheet--rain-near"></div>
                <div class="precipitation__sheet precipitation__sheet--snow-far"></div>
                <div class="precipitation__sheet precipitation__sheet--snow-near"></div>
              </div>
            </div>
            <div class="lightning"></div>
          </div>

          <div class="glass-wet"></div>
          <div class="reflection depth"></div>

          <div class="sash">
            <canvas class="glass-rain" id="glass-rain" data-active="false"></canvas>
            <div class="glass-drops"></div>
            <div class="frost">
              <div class="frost__pane"></div>
              <div class="frost__pane"></div>
              <div class="frost__pane"></div>
              <div class="frost__pane"></div>
              <div class="frost__pane"></div>
              <div class="frost__pane"></div>
              <div class="frost__pane"></div>
              <div class="frost__pane"></div>
              <div class="frost__pane"></div>
            </div>
            <div class="mullion mullion--vertical mullion--v1"></div>
            <div class="mullion mullion--vertical mullion--v2"></div>
            <div class="mullion mullion--horizontal mullion--h1"></div>
            <div class="mullion mullion--horizontal mullion--h2"></div>
          </div>

          <div class="reveal"></div>
        </div>

        <div class="stool"></div>
      </div>
      <div class="dimmer"></div>
    </div>
  </body>
</html>
